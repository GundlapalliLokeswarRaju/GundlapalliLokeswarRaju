<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="74" viewBox="0 0 1200 74" role="img" aria-label="$ tail -f ~/feed.log"><title>$ tail -f ~/feed.log</title><style>@font-face{font-family:'JB';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBB';src:url(data:font/woff2;base64,) format('woff2');}
