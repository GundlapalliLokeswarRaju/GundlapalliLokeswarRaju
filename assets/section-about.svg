<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="About">
<title>About</title>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".30"/></pattern>
<filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff7a" stop-opacity="0"/><stop offset=".5" stop-color="#39ff7a"/><stop offset="1" stop-color="#39ff7a" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="62" rx="12"/></clipPath>

</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace}
.g{fill:#39ff7a} .t{fill:#c9d1d9} .m{fill:#6e7f8d} .b{font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}

</style>
<text x="40" y="26" font-size="14" class="m">$ cd ~/about</text><text x="40" y="52" font-size="26" class="g b" filter="url(#glow)">&gt; About<tspan class="cur">_</tspan></text><rect x="40" y="58" width="1120" height="1.5" fill="url(#fade)" opacity=".6"/>
</svg>
