<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Tech stack">
<title>Tech stack</title>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".30"/></pattern>
<filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff7a" stop-opacity="0"/><stop offset=".5" stop-color="#39ff7a"/><stop offset="1" stop-color="#39ff7a" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="328" rx="12"/></clipPath>

</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace}
.g{fill:#39ff7a} .t{fill:#c9d1d9} .m{fill:#6e7f8d} .b{font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}

</style>
<rect x="1" y="1" width="1198" height="328" rx="12" fill="#0d1117" stroke="#1f6f43" stroke-width="2"/>
<path d="M1 13a12 12 0 0 1 12-12h1174a12 12 0 0 1 12 12v30H1z" fill="#111a22"/>
<circle cx="26" cy="22" r="6" fill="#ff5f56"/><circle cx="48" cy="22" r="6" fill="#ffbd2e"/><circle cx="70" cy="22" r="6" fill="#39ff7a"/>
<text x="600" y="27" text-anchor="middle" class="m" font-size="13">neofetch --stack</text><text x="42" y="150" font-size="96" class="g b pulse" filter="url(#glow)">{ }</text><text x="48" y="205" font-size="15" class="m">data . ai . cloud</text><text x="360" y="100" font-size="18"><tspan class="g b">lokeswar</tspan><tspan class="m">@</tspan><tspan class="g b">stack</tspan></text><rect x="360" y="110" width="760" height="1.5" fill="#1f6f43"/><text x="360" y="142" font-size="17" class="g b">languages</text><text x="500" y="142" font-size="17" class="t">Python  .  SQL</text><text x="360" y="174" font-size="17" class="g b">cloud</text><text x="500" y="174" font-size="17" class="t">Azure  .  Azure Data Factory  .  Azure Storage</text><text x="360" y="206" font-size="17" class="g b">data</text><text x="500" y="206" font-size="17" class="t">Pandas  .  NumPy  .  Spark  .  Databricks</text><text x="360" y="238" font-size="17" class="g b">ml / ai</text><text x="500" y="238" font-size="17" class="t">Machine Learning  .  scikit-learn  .  LLMs</text><text x="360" y="270" font-size="17" class="g b">tools</text><text x="500" y="270" font-size="17" class="t">Git  .  GitHub Actions  .  Docker  .  Jupyter  .  Power BI</text><rect x="360" y="308" width="30" height="16" fill="#ff5f56"/><rect x="394" y="308" width="30" height="16" fill="#ffbd2e"/><rect x="428" y="308" width="30" height="16" fill="#39ff7a"/><rect x="462" y="308" width="30" height="16" fill="#58a6ff"/><rect x="496" y="308" width="30" height="16" fill="#bc8cff"/><rect x="530" y="308" width="30" height="16" fill="#39c5cf"/><rect x="564" y="308" width="30" height="16" fill="#c9d1d9"/><rect x="598" y="308" width="30" height="16" fill="#6e7f8d"/><rect x="1" y="1" width="1198" height="328" rx="12" fill="url(#scan)" pointer-events="none"/>
</svg>
