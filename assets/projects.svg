<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Featured projects">
<title>Featured projects</title>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".30"/></pattern>
<filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff7a" stop-opacity="0"/><stop offset=".5" stop-color="#39ff7a"/><stop offset="1" stop-color="#39ff7a" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="1198" height="428" rx="12"/></clipPath>

</defs>
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace}
.g{fill:#39ff7a} .t{fill:#c9d1d9} .m{fill:#6e7f8d} .b{font-weight:700}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}

</style>
<text x="40" y="30" font-size="14" class="m">$ ls ~/projects --top</text><rect x="40" y="46" width="548" height="170" rx="10" fill="#111a22" stroke="#1f6f43" stroke-width="1.5"/><text x="68" y="90" font-size="20" class="g b" filter="url(#glow)">./YOUR-PROJECT-1</text><text x="560" y="90" text-anchor="end" font-size="13" class="m">#01</text><rect x="68" y="100" width="492" height="1" fill="#1f6f43"/><text x="68" y="130" font-size="14" class="t">End-to-end ETL pipeline that ingests, cleans and loads</text><text x="68" y="152" font-size="14" class="t">data into a warehouse.</text><rect x="68" y="176" width="61" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="99" y="193" text-anchor="middle" font-size="12" class="g">Python</text><rect x="139.2" y="176" width="37" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="158" y="193" text-anchor="middle" font-size="12" class="g">SQL</text><rect x="185.79999999999998" y="176" width="53" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="212" y="193" text-anchor="middle" font-size="12" class="g">Azure</text><rect x="612" y="46" width="548" height="170" rx="10" fill="#111a22" stroke="#1f6f43" stroke-width="1.5"/><text x="640" y="90" font-size="20" class="g b" filter="url(#glow)">./YOUR-PROJECT-2</text><text x="1132" y="90" text-anchor="end" font-size="13" class="m">#02</text><rect x="640" y="100" width="492" height="1" fill="#1f6f43"/><text x="640" y="130" font-size="14" class="t">Machine learning model for prediction or classification on</text><text x="640" y="152" font-size="14" class="t">real-world data.</text><rect x="640" y="176" width="61" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="671" y="193" text-anchor="middle" font-size="12" class="g">Python</text><rect x="711.2" y="176" width="110" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="766" y="193" text-anchor="middle" font-size="12" class="g">scikit-learn</text><rect x="40" y="236" width="548" height="170" rx="10" fill="#111a22" stroke="#1f6f43" stroke-width="1.5"/><text x="68" y="280" font-size="20" class="g b" filter="url(#glow)">./YOUR-PROJECT-3</text><text x="560" y="280" text-anchor="end" font-size="13" class="m">#03</text><rect x="68" y="290" width="492" height="1" fill="#1f6f43"/><text x="68" y="320" font-size="14" class="t">Cloud-based data processing and analytics workflow.</text><rect x="68" y="366" width="53" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="94" y="383" text-anchor="middle" font-size="12" class="g">Azure</text><rect x="131.0" y="366" width="37" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="149" y="383" text-anchor="middle" font-size="12" class="g">SQL</text><rect x="177.6" y="366" width="37" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="196" y="383" text-anchor="middle" font-size="12" class="g">Git</text><rect x="612" y="236" width="548" height="170" rx="10" fill="#111a22" stroke="#1f6f43" stroke-width="1.5"/><text x="640" y="280" font-size="20" class="g b" filter="url(#glow)">./YOUR-PROJECT-4</text><text x="1132" y="280" text-anchor="end" font-size="13" class="m">#04</text><rect x="640" y="290" width="492" height="1" fill="#1f6f43"/><text x="640" y="320" font-size="14" class="t">Dashboard and reporting project that turns data into</text><text x="640" y="342" font-size="14" class="t">insights.</text><rect x="640" y="366" width="61" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="671" y="383" text-anchor="middle" font-size="12" class="g">Python</text><rect x="711.2" y="366" width="78" height="24" rx="12" fill="none" stroke="#1f6f43"/><text x="750" y="383" text-anchor="middle" font-size="12" class="g">Power BI</text><rect x="1" y="1" width="1198" height="428" rx="12" fill="url(#scan)" pointer-events="none"/>
</svg>
